# =====================================================================
# Sudan Trains — host reverse proxy (place on the SERVER, not in Docker)
# Install path (Debian/Ubuntu): /etc/nginx/sites-available/sudan-trains.conf
#   sudo ln -s /etc/nginx/sites-available/sudan-trains.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTP-ONLY bootstrap. Certbot adds the HTTPS (443) server blocks + certs:
#   sudo certbot --nginx -d sudan-trains.com -d www.sudan-trains.com \
#                        -d admin.sudan-trains.com -d api.sudan-trains.com
#
# Docker Compose publishes on the host (localhost only):
#   customer -> 127.0.0.1:3000 | admin -> 127.0.0.1:3001 | backend-api -> 127.0.0.1:8081
# =====================================================================

# ---------------------------------------------------------------------
# 1) Customer site — apex + www
# ---------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name sudan-trains.com www.sudan-trains.com;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---------------------------------------------------------------------
# 2) Admin dashboard
# ---------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name admin.sudan-trains.com;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---------------------------------------------------------------------
# 3) Backend API (+ Swagger)
# ---------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.sudan-trains.com;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # websockets (safe to keep even if unused)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}

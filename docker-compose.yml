name: sudan-train-platform

services:
  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3-management
    container_name: sudan-train-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    ports:
      - "127.0.0.1:${RABBITMQ_AMQP_PORT:-5673}:5672" # AMQP (localhost only)
      - "127.0.0.1:${RABBITMQ_MGMT_PORT:-15673}:15672" # Management UI (localhost only)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - sudan-train-network
    restart: unless-stopped
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Sudan Train Messaging API
  messaging-api:
    build:
      context: ./apps/backend
      dockerfile: Sudan_Train.MessagingApi/Dockerfile
    image: sudan-train-messaging-api:latest
    container_name: sudan-train-messaging-api
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ASPNETCORE_URLS=http://+:80
      # DB, email, SMS/push: Sudan_Train.MessagingApi/appsettings.json (baked into image)
      # Docker-only overrides (appsettings uses localhost for RabbitMQ)
      - RabbitMQSettings__HostName=rabbitmq
      - RabbitMQSettings__Port=5672
      - RabbitMQSettings__UserName=guest
      - RabbitMQSettings__Password=guest
      - RabbitMQSettings__VirtualHost=/
      - EmailSettings__Host=${EMAIL_HOST:-smtp.hostinger.com}
      - EmailSettings__Port=${EMAIL_PORT:-587}
      - EmailSettings__FromName=${EMAIL_FROM_NAME:-Sudan Train Booking System}
      - EmailSettings__FromEmail=${EMAIL_FROM}
      - EmailSettings__UserName=${EMAIL_USERNAME}
      - EmailSettings__Password=${EMAIL_PASSWORD}
      - EmailSettings__EnableSsl=${EMAIL_ENABLE_SSL:-true}
      - EmailSettings__DefaultStrategy=${EMAIL_DEFAULT_STRATEGY:-Queued}
      - SmsSettings__AccountSid=${TWILIO_ACCOUNT_SID:-}
      - SmsSettings__AuthToken=${TWILIO_AUTH_TOKEN:-}
      - SmsSettings__FromNumber=${TWILIO_FROM_NUMBER:-}
      - PushSettings__ServiceAccountKeyPath=${FIREBASE_KEY_PATH:-}
    ports:
      - "127.0.0.1:${MESSAGING_API_PORT:-5002}:80"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - sudan-train-network
    restart: unless-stopped

  # Sudan Train Backend API
  backend-api:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    image: sudan-train-backend-api:latest
    container_name: sudan-train-backend-api
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ASPNETCORE_URLS=http://+:80
      # DB, JWT, email, etc.: Sudan_Train/appsettings.json (baked into image)
      # Docker-only overrides (appsettings uses localhost for RabbitMQ / Messaging API)
      - RabbitMQSettings__HostName=rabbitmq
      - RabbitMQSettings__Port=5672
      - RabbitMQSettings__UserName=guest
      - RabbitMQSettings__Password=guest
      - RabbitMQSettings__VirtualHost=/
      - MessagingApi__BaseUrl=http://messaging-api
      # Email confirmation / reset links — set FRONTEND_BASE_URL in .env for production
      - Frontend__BaseUrl=${FRONTEND_BASE_URL:-http://localhost:3000}
    ports:
      - "127.0.0.1:${BACKEND_API_PORT:-8081}:80"
    volumes:
      - ./apps/backend/Logs:/app/Logs # Mount logs directory
    depends_on:
      rabbitmq:
        condition: service_healthy
      messaging-api:
        condition: service_started
    networks:
      - sudan-train-network
    restart: unless-stopped

  # Sudan Train Customer App (Public Booking Site)
  customer:
    build:
      context: ./apps/frontend/customer
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8081}
        - VITE_MESSAGING_API_URL=${VITE_MESSAGING_API_URL:-http://localhost:5002}
    image: sudan-train-customer:latest
    container_name: sudan-train-customer
    ports:
      - "127.0.0.1:${CUSTOMER_PORT:-3000}:80"
    depends_on:
      - backend-api
    networks:
      - sudan-train-network
    restart: unless-stopped

  # Sudan Train Admin Dashboard (Management Portal)
  admin:
    build:
      context: ./apps/frontend/admin
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8081}
        - VITE_MESSAGING_API_URL=${VITE_MESSAGING_API_URL:-http://localhost:5002}
        - VITE_GOOGLE_MAPS_API_KEY=${VITE_GOOGLE_MAPS_API_KEY:-AIzaSyBwgPpXdlERV4l4OfuahpcTksHME8HU6H0}
    image: sudan-train-admin:latest
    container_name: sudan-train-admin
    ports:
      - "127.0.0.1:${ADMIN_PORT:-3001}:80"
    depends_on:
      - backend-api
    networks:
      - sudan-train-network
    restart: unless-stopped

volumes:
  rabbitmq_data:

networks:
  sudan-train-network:
    driver: bridge

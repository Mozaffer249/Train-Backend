version: "3.8"

services:
  # SQL Server Database
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: train-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${SQL_PASSWORD:-YourStrong@Passw0rd} # ⚠️ Change in production
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - train-network
    restart: unless-stopped
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -Q "SELECT 1" -C || exit 1
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Sudan Train API
  train-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: train-api
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__dbcontext=Server=sqlserver,1433;Database=TrainsDb;User Id=sa;Password=${SQL_PASSWORD:-YourStrong@Passw0rd};TrustServerCertificate=True;
      - jwtSettings__Secret=${JWT_SECRET:-TrainProjectSecretKey123456789TrainProjectSecretKey123456789}
      - emailSettings__FromEmail=${EMAIL_FROM:-your-email@gmail.com}
      - emailSettings__Password=${EMAIL_PASSWORD:-your-app-password}
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./Logs:/app/Logs # Mount logs directory
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - train-network
    restart: unless-stopped

volumes:
  sqlserver_data:

networks:
  train-network:
    driver: bridge

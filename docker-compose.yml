name: sudan-train-platform

services:
  # SQL Server Database
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sudan-train-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${SQL_PASSWORD:-YourStrong@Passw0rd} # ⚠️ Change in production
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - sudan-train-network
    restart: unless-stopped
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -Q "SELECT 1" -C || exit 1
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3-management
    container_name: sudan-train-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    ports:
      - "5672:5672" # AMQP port
      - "15672:15672" # Management UI (http://localhost:15672)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - sudan-train-network
    restart: unless-stopped
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Sudan Train Messaging API
  messaging-api:
    build:
      context: ./apps/backend
      dockerfile: Sudan_Train.MessagingApi/Dockerfile
    image: sudan-train-messaging-api:latest
    container_name: sudan-train-messaging-api
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__MessagingDb=Server=sqlserver,1433;Database=MessagingDb;User Id=sa;Password=${SQL_PASSWORD:-YourStrong@Passw0rd};TrustServerCertificate=True;
      - RabbitMQSettings__HostName=rabbitmq
      - RabbitMQSettings__Port=5672
      - RabbitMQSettings__UserName=guest
      - RabbitMQSettings__Password=guest
      - RabbitMQSettings__VirtualHost=/
      - RabbitMQSettings__EmailQueueName=email-queue
      - RabbitMQSettings__SmsQueueName=sms-queue
      - RabbitMQSettings__PushQueueName=push-queue
      - EmailSettings__Host=smtp.gmail.com
      - EmailSettings__Port=587
      - EmailSettings__FromName=Sudan Train Booking System
      - EmailSettings__FromEmail=mozafferragab@gmail.com
      - EmailSettings__UserName=mozafferragab@gmail.com
      - EmailSettings__Password=ohjgtbdlxxjuhlvk
      - EmailSettings__EnableSsl=true
      - EmailSettings__DefaultStrategy=Queued
      - SmsSettings__AccountSid=${TWILIO_ACCOUNT_SID:-}
      - SmsSettings__AuthToken=${TWILIO_AUTH_TOKEN:-}
      - SmsSettings__FromNumber=${TWILIO_FROM_NUMBER:-}
      - PushSettings__ServiceAccountKeyPath=${FIREBASE_KEY_PATH:-}
    ports:
      - "5001:80"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - sudan-train-network
    restart: unless-stopped

  # Sudan Train Backend API
  backend-api:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    image: sudan-train-backend-api:latest
    container_name: sudan-train-backend-api
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__dbcontext=Server=sqlserver,1433;Database=TrainsDb;User Id=sa;Password=${SQL_PASSWORD:-YourStrong@Passw0rd};TrustServerCertificate=True;
      - jwtSettings__Secret=${JWT_SECRET:-TrainProjectSecretKey123456789TrainProjectSecretKey123456789}
      - MessagingApi__BaseUrl=http://messaging-api
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./apps/backend/Logs:/app/Logs # Mount logs directory
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      messaging-api:
        condition: service_started
    networks:
      - sudan-train-network
    restart: unless-stopped

  # Sudan Train Customer App (Public Booking Site)
  customer:
    build:
      context: ./apps/frontend/customer
      dockerfile: Dockerfile
    image: sudan-train-customer:latest
    container_name: sudan-train-customer
    environment:
      - VITE_API_URL=http://localhost:8080
      - VITE_MESSAGING_API_URL=http://localhost:5001
    ports:
      - "3000:80"
    depends_on:
      - backend-api
    networks:
      - sudan-train-network
    restart: unless-stopped

  # Sudan Train Admin Dashboard (Management Portal)
  admin:
    build:
      context: ./apps/frontend/admin
      dockerfile: Dockerfile
    image: sudan-train-admin:latest
    container_name: sudan-train-admin
    environment:
      - VITE_API_URL=http://localhost:8080
      - VITE_MESSAGING_API_URL=http://localhost:5001
    ports:
      - "3001:80"
    depends_on:
      - backend-api
    networks:
      - sudan-train-network
    restart: unless-stopped

volumes:
  sqlserver_data:
  rabbitmq_data:

networks:
  sudan-train-network:
    driver: bridge
